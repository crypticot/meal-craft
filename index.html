<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MealCraft - Personal Meal Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --primary: #10b981;
    --primary-hover: #059669;
    --primary-light: #ecfdf5;
    --ink: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --radius-lg: 16px;
    --radius-md: 10px;
    --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
  body { background: var(--bg); color: var(--ink); padding-bottom: 60px; }
  button { cursor: pointer; }
  img { display: block; }

  /* Header */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; font-weight: 800; color: var(--primary); }
  .nav-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .container { max-width: 1280px; margin: 0 auto; padding: 1.5rem; }

  /* Buttons and fields */
  .btn {
    padding: 0.6rem 1.1rem;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink);
    font-weight: 600;
    font-size: 0.88rem;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .btn:hover { background: #f1f5f9; }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-danger { color: #ef4444; border-color: #fca5a5; }
  .btn-danger:hover { background: #fef2f2; }
  .small { padding: 0.35rem 0.8rem; font-size: 0.8rem; }
  .field {
    width: 100%;
    padding: 0.7rem;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    font-size: 0.95rem;
    outline: none;
  }
  .field:focus { border-color: var(--primary); }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 1.2rem; }
  .controls .field { flex: 1; min-width: 160px; width: auto; }
  .note { font-size: 0.82rem; color: var(--muted); }
  h2 { font-size: 1.35rem; }

  /* Hero */
  .hero {
    background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
    border: 1px solid #a7f3d0;
    border-radius: var(--radius-lg);
    padding: 1.8rem;
    margin-bottom: 1.8rem;
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 1.5rem;
    align-items: center;
  }
  .hero h1 { font-size: 2.1rem; font-weight: 800; color: #065f46; margin-bottom: 0.4rem; }
  .hero p { color: #047857; margin-bottom: 0.9rem; }
  .today-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
  .tchip {
    background: #fff;
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 0.8rem;
    color: var(--muted);
    box-shadow: var(--shadow);
  }
  .tchip b { color: var(--ink); }
  .stats {
    background: #fff;
    padding: 1.2rem;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    display: flex;
    justify-content: space-around;
    text-align: center;
  }
  .stats h3 { font-size: 1.6rem; color: var(--primary); font-weight: 800; }
  .stats p { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 0; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; margin-bottom: 1.4rem; border-bottom: 2px solid var(--border); overflow-x: auto; }
  .tab {
    padding: 0.6rem 1.1rem;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }
  .tab.on { color: var(--primary); border-bottom-color: var(--primary); }

  /* Planner */
  .days-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.3rem; }
  .day-card { background: var(--card); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
  .day-header { background: #f8fafc; padding: 0.9rem 1.2rem; border-bottom: 1px solid var(--border); font-weight: 700; }
  .day-card.is-today .day-header { background: var(--primary); color: #fff; }
  .meal-slots { padding: 0.9rem; display: flex; flex-direction: column; gap: 0.9rem; }
  .meal-slot { border: 1px dashed var(--border); border-radius: var(--radius-md); padding: 0.7rem; background: #fafafa; }
  .slot-label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; color: var(--primary); margin-bottom: 0.45rem; }
  .empty-slot {
    width: 100%;
    padding: 0.7rem;
    background: transparent;
    border: 1px dashed #cbd5e1;
    border-radius: 8px;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.85rem;
  }
  .empty-slot:hover { background: #fff; border-color: var(--primary); color: var(--primary); }

  /* Meal cards (planner, library, output) */
  .mcard {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    text-align: left;
    width: 100%;
    display: block;
  }
  button.mcard:hover { border-color: var(--primary); }
  .pic {
    width: 100%;
    height: 120px;
    object-fit: cover;
    background: var(--primary-light);
    display: grid;
    place-items: center;
    font-size: 2.2rem;
    color: var(--primary);
  }
  .mbody { padding: 0.7rem 0.8rem 0.8rem; }
  .mtitle { font-weight: 700; font-size: 0.95rem; }
  .mhead { background: #f1f5f9; padding: 0.55rem 0.9rem; font-weight: 800; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 0.45rem; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--primary-light);
    color: #047857;
    border: 1.5px solid transparent;
    border-radius: 16px;
    padding: 2px 10px 2px 3px;
    font-size: 0.74rem;
    font-weight: 600;
  }
  .chip img, .chip .dot { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; background: #fff; }
  button.chip { font-size: 0.82rem; background: #f1f5f9; color: var(--ink); }
  button.chip.sel { background: var(--primary-light); border-color: var(--primary); color: #047857; }
  .acts { display: flex; gap: 6px; margin-top: 0.7rem; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.1rem; }
  .grid.tight { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .grid.tight .pic { height: 90px; }

  /* Modal and toast */
  #modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 14px;
    z-index: 1000;
  }
  #modal.open { display: flex; }
  #modalBox {
    background: #fff;
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 1.4rem;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.12);
  }
  #modalBox h3 { margin-bottom: 0.9rem; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 8px; margin: 0.8rem 0; }
  .res { border: 2px solid var(--border); border-radius: 8px; background: #fff; overflow: hidden; text-align: left; padding: 0; }
  .res:hover { border-color: var(--primary); }
  .res img { width: 100%; height: 80px; object-fit: cover; }
  .res span { display: block; padding: 4px 6px; font-size: 0.68rem; color: var(--muted); }
  #toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; }
    .hero h1 { font-size: 1.7rem; }
  }
  @media print {
    header, .hero, .tabs, .noprint, #modal, #toasts { display: none !important; }
    body { background: #fff; padding: 0; }
    .container { padding: 0; }
    .grid { grid-template-columns: repeat(3, 1fr); }
    .mcard { break-inside: avoid; }
  }
</style>
</head>
<body>

<header>
  <div class="brand"><i class="fa-solid fa-utensils"></i><span>MealCraft</span></div>
  <div class="nav-actions">
    <button class="btn" onclick="savePlan()"><i class="fa-solid fa-download"></i> Save plan</button>
    <button class="btn" onclick="$('importFile').click()"><i class="fa-solid fa-upload"></i> Import plan</button>
    <button class="btn btn-danger" onclick="resetAll()"><i class="fa-solid fa-trash"></i> Reset</button>
    <input type="file" id="importFile" accept=".json" hidden onchange="importPlan(this)">
  </div>
</header>

<div class="container">
  <div id="hero"></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<div id="modal"><div id="modalBox"></div></div>
<div id="toasts"></div>

<script>
  const STORE_KEY = "mealcraft-v2";
  const TABS = [
    ["planner", "Meal Planner"],
    ["meals", "My Meals"],
    ["pantry", "Pantry"],
    ["output", "Output Grid"]
  ];

  let state = load();
  let ui = {
    view: "planner",
    weekStart: mondayOf(new Date()),
    outFrom: "",
    outTo: "",
    target: null,
    draft: null,
    candidates: []
  };
  ui.outFrom = ui.weekStart;
  ui.outTo = addDays(ui.weekStart, 6);

  /* ---------- Storage ---------- */
  function emptyState() {
    return { ingredients: [], meals: [], slots: ["Breakfast", "Lunch", "Dinner"], plan: {}, pexelsKey: "" };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return Object.assign(emptyState(), JSON.parse(raw));
    } catch (e) {}
    return emptyState();
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {
      alert("Browser storage is full. Save your plan to a file and remove some pictures.");
    }
  }

  /* ---------- Helpers ---------- */
  const $ = (id) => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const getIng = (id) => state.ingredients.find((i) => i.id === id);
  const getMeal = (id) => state.meals.find((m) => m.id === id);

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function iso(d) {
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function parse(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function addDays(s, n) {
    const d = typeof s === "string" ? parse(s) : new Date(s);
    d.setDate(d.getDate() + n);
    return iso(d);
  }

  function mondayOf(date) {
    const d = new Date(date);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return iso(d);
  }

  function pretty(s) {
    return parse(s).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    $("toasts").appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  function pic(img, fallback) {
    return img ? '<img class="pic" src="' + esc(img) + '" alt="">' : '<div class="pic">' + fallback + "</div>";
  }

  function chip(p) {
    const thumb = p.img ? '<img src="' + esc(p.img) + '" alt="">' : '<i class="dot"></i>';
    return '<span class="chip">' + thumb + esc(p.name) + "</span>";
  }

  function mealImg(m) {
    if (m.img) return m.img;
    const first = m.items.map(getIng).find((i) => i && i.img);
    return first ? first.img : "";
  }

  function mealChips(m) {
    return '<div class="chips">' + m.items.map(getIng).filter(Boolean).map(chip).join("") + "</div>";
  }

  /* ---------- Page shell ---------- */
  function go(view) {
    ui.view = view;
    render();
  }

  function render() {
    $("hero").innerHTML = heroHTML();
    $("tabs").innerHTML = TABS.map((t) =>
      '<button class="tab ' + (ui.view === t[0] ? "on" : "") + '" onclick="go(\'' + t[0] + '\')">' + t[1] + "</button>"
    ).join("");
    const views = { planner: plannerView, meals: mealsView, pantry: pantryView, output: outputView };
    $("view").innerHTML = views[ui.view]();
  }

  function planStats() {
    let days = 0;
    let meals = 0;
    Object.values(state.plan).forEach((day) => {
      const n = Object.values(day).filter(getMeal).length;
      if (n) days++;
      meals += n;
    });
    return { days: days, meals: meals };
  }

  function heroHTML() {
    const st = planStats();
    const today = state.plan[iso(new Date())] || {};
    const chips = state.slots.map((s) => {
      const m = getMeal(today[s]);
      return '<span class="tchip"><b>' + esc(s) + ":</b> " + (m ? esc(m.title) : "not planned") + "</span>";
    }).join("");

    return `
      <section class="hero">
        <div>
          <h1>Organize Your Taste.</h1>
          <p>Today's meals at a glance, and one tap to plan the rest.</p>
          <div class="today-row">${chips}</div>
          <div class="acts" style="margin-top:0">
            <button class="btn btn-primary" onclick="openMealEditor(null, false)"><i class="fa-solid fa-plus"></i> New meal</button>
            <button class="btn" onclick="go('pantry'); setTimeout(() => $('newItems').focus(), 50)"><i class="fa-solid fa-carrot"></i> Add ingredients</button>
          </div>
        </div>
        <div class="stats">
          <div><h3>${st.days}</h3><p>Days planned</p></div>
          <div><h3>${st.meals}</h3><p>Meals set</p></div>
          <div><h3>${state.ingredients.length}</h3><p>Pantry items</p></div>
        </div>
      </section>`;
  }

  /* ---------- Modal ---------- */
  function openModal(html) {
    $("modalBox").innerHTML = html;
    $("modal").classList.add("open");
  }

  function closeModal() {
    $("modal").classList.remove("open");
  }

  $("modal").addEventListener("click", (e) => {
    if (e.target.id === "modal") closeModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });

  /* ---------- Planner ---------- */
  function plannerView() {
    const today = iso(new Date());
    const days = [];
    for (let i = 0; i < 7; i++) days.push(addDays(ui.weekStart, i));

    const cards = days.map((date) => {
      const slots = state.slots.map((s, i) => {
        const m = getMeal((state.plan[date] || {})[s]);
        const body = m
          ? `<button class="mcard" onclick="openSlot('${date}', ${i})">
               ${pic(mealImg(m), '<i class="fa-solid fa-bowl-food"></i>')}
               <div class="mbody"><div class="mtitle">${esc(m.title)}</div>${mealChips(m)}</div>
             </button>`
          : `<button class="empty-slot" onclick="openSlot('${date}', ${i})">+ Add ${esc(s)}</button>`;
        return `<div class="meal-slot"><div class="slot-label">${esc(s)}</div>${body}</div>`;
      }).join("");
      return `<div class="day-card ${date === today ? "is-today" : ""}">
        <div class="day-header">${pretty(date)}</div><div class="meal-slots">${slots}</div></div>`;
    }).join("");

    return `
      <div class="controls">
        <button class="btn small" onclick="shiftWeek(-7)"><i class="fa-solid fa-chevron-left"></i> Prev</button>
        <strong>${pretty(days[0])} to ${pretty(days[6])}</strong>
        <button class="btn small" onclick="shiftWeek(7)">Next <i class="fa-solid fa-chevron-right"></i></button>
        <button class="btn small" onclick="ui.weekStart = mondayOf(new Date()); render()">This week</button>
        <button class="btn small" onclick="copyWeek()"><i class="fa-regular fa-copy"></i> Copy to next week</button>
        <button class="btn small" onclick="openSlots()"><i class="fa-solid fa-gear"></i> Edit slots</button>
      </div>
      <div class="days-grid">${cards}</div>`;
  }

  function shiftWeek(n) {
    ui.weekStart = addDays(ui.weekStart, n);
    render();
  }

  function copyWeek() {
    if (!confirm("Copy this week's meals onto next week? Meals already there will be replaced.")) return;
    for (let i = 0; i < 7; i++) {
      const from = addDays(ui.weekStart, i);
      const to = addDays(from, 7);
      if (state.plan[from]) state.plan[to] = Object.assign({}, state.plan[from]);
      else delete state.plan[to];
    }
    save();
    shiftWeek(7);
    toast("Week copied");
  }

  /* Pick a saved meal for a slot (one-tap planning) */
  function openSlot(date, slotIndex) {
    const slot = state.slots[slotIndex];
    ui.target = { date: date, slot: slot };
    const current = (state.plan[date] || {})[slot];

    const list = state.meals.map((m) => `
      <button class="mcard" data-name="${esc(m.title.toLowerCase())}" onclick="pickMeal('${m.id}')">
        ${pic(mealImg(m), '<i class="fa-solid fa-bowl-food"></i>')}
        <div class="mbody"><div class="mtitle">${esc(m.title)}</div></div>
      </button>`).join("");

    openModal(`
      <h3>${esc(slot)}, ${pretty(date)}</h3>
      <div class="controls">
        <input class="field" id="mealFilter" placeholder="Filter your meals" oninput="filterMeals(this.value)">
        <button class="btn btn-primary small" onclick="openMealEditor(null, true)"><i class="fa-solid fa-plus"></i> New meal</button>
      </div>
      <div class="grid tight" id="mealPick">
        ${list || '<p class="note">No saved meals yet. Create one with New meal, then reuse it anywhere.</p>'}
      </div>
      <div class="acts">
        ${current ? '<button class="btn btn-danger small" onclick="clearSlot()">Leave empty</button>' : ""}
        <button class="btn small" onclick="closeModal()">Close</button>
      </div>`);
  }

  function filterMeals(q) {
    document.querySelectorAll("#mealPick .mcard").forEach((el) => {
      el.style.display = el.dataset.name.includes(q.toLowerCase()) ? "" : "none";
    });
  }

  function assign(mealId) {
    const t = ui.target;
    state.plan[t.date] = state.plan[t.date] || {};
    state.plan[t.date][t.slot] = mealId;
  }

  function pickMeal(id) {
    assign(id);
    save();
    closeModal();
    render();
    toast("Planned");
  }

  function clearSlot() {
    const t = ui.target;
    if (state.plan[t.date]) delete state.plan[t.date][t.slot];
    save();
    closeModal();
    render();
  }

  /* Meal slots editor */
  function openSlots() {
    const rows = state.slots.map((s, i) => `
      <div class="controls" style="margin-bottom:8px">
        <input class="field" value="${esc(s)}" onchange="renameSlot(${i}, this.value)">
        <button class="btn btn-danger small" onclick="deleteSlot(${i})">Remove</button>
      </div>`).join("");
    openModal(`
      <h3>Meal slots</h3>
      ${rows}
      <div class="controls">
        <input class="field" id="newSlot" placeholder="New slot, e.g. Snack">
        <button class="btn btn-primary small" onclick="addSlot()">Add</button>
      </div>
      <div class="acts"><button class="btn small" onclick="closeModal(); render()">Done</button></div>`);
  }

  function renameSlot(i, value) {
    const name = value.trim();
    const old = state.slots[i];
    if (!name || name === old || state.slots.includes(name)) return openSlots();
    state.slots[i] = name;
    Object.values(state.plan).forEach((day) => {
      if (day[old] !== undefined) {
        day[name] = day[old];
        delete day[old];
      }
    });
    save();
    toast("Slot renamed");
  }

  function deleteSlot(i) {
    const name = state.slots[i];
    if (!confirm("Remove the " + name + " slot? Meals planned in it will be cleared.")) return;
    state.slots.splice(i, 1);
    Object.values(state.plan).forEach((day) => delete day[name]);
    save();
    openSlots();
  }

  function addSlot() {
    const name = $("newSlot").value.trim();
    if (!name || state.slots.includes(name)) return;
    state.slots.push(name);
    save();
    openSlots();
  }

  /* ---------- Meals library ---------- */
  function mealsView() {
    const cards = state.meals.map((m) => `
      <div class="mcard">
        ${pic(mealImg(m), '<i class="fa-solid fa-bowl-food"></i>')}
        <div class="mbody">
          <div class="mtitle">${esc(m.title)}</div>
          ${mealChips(m)}
          <div class="acts">
            <button class="btn small" onclick="openMealEditor('${m.id}', false)">Edit</button>
            <button class="btn small" onclick="openPicker('meal', '${m.id}')">Photo</button>
            <button class="btn btn-danger small" onclick="deleteMeal('${m.id}')">Delete</button>
          </div>
        </div>
      </div>`).join("");

    return `
      <div class="controls">
        <h2 style="flex:1">My Meals</h2>
        <button class="btn btn-primary" onclick="openMealEditor(null, false)"><i class="fa-solid fa-plus"></i> New meal</button>
      </div>
      <p class="note" style="margin-bottom:1rem">Build a meal once, then drop it into any slot with one tap. Without its own photo, a meal shows the first ingredient picture.</p>
      <div class="grid">${cards || '<p class="note">No meals yet. Create your first one.</p>'}</div>`;
  }

  function deleteMeal(id) {
    if (!confirm("Delete this meal? It will be removed from the planner too.")) return;
    state.meals = state.meals.filter((m) => m.id !== id);
    Object.values(state.plan).forEach((day) => {
      Object.keys(day).forEach((s) => { if (day[s] === id) delete day[s]; });
    });
    save();
    render();
    toast("Meal deleted");
  }

  /* shouldAssign is true when the editor was opened from a planner slot */
  function openMealEditor(id, shouldAssign) {
    const m = id ? getMeal(id) : null;
    ui.draft = { id: id, items: m ? m.items.slice() : [], assign: shouldAssign };
    openModal(`
      <h3>${m ? "Edit meal" : "New meal"}</h3>
      <input class="field" id="mealTitle" placeholder="Meal title, e.g. Sunday rice bowl" value="${esc(m ? m.title : "")}" style="margin-bottom:12px">
      <p class="note">Pick ingredients from your pantry</p>
      <div class="chips" id="draftChips" style="margin-bottom:12px"></div>
      <div class="controls">
        <input class="field" id="quickAdd" placeholder="Quick add new ingredients, e.g. egg, onion" onkeydown="if (event.key === 'Enter') quickAdd()">
        <button class="btn small" onclick="quickAdd()">Add</button>
      </div>
      <div class="acts">
        <button class="btn btn-primary small" onclick="saveMeal()">Save meal</button>
        <button class="btn small" onclick="closeModal()">Cancel</button>
      </div>`);
    drawDraftChips();
  }

  function drawDraftChips() {
    $("draftChips").innerHTML = state.ingredients.map((p) => {
      const thumb = p.img ? '<img src="' + esc(p.img) + '" alt="">' : '<i class="dot"></i>';
      const on = ui.draft.items.includes(p.id) ? "sel" : "";
      return '<button class="chip ' + on + '" onclick="toggleDraft(\'' + p.id + '\')">' + thumb + esc(p.name) + "</button>";
    }).join("") || '<span class="note">Your pantry is empty. Use quick add below.</span>';
  }

  function toggleDraft(id) {
    const list = ui.draft.items;
    const at = list.indexOf(id);
    if (at >= 0) list.splice(at, 1);
    else list.push(id);
    drawDraftChips();
  }

  function quickAdd() {
    const input = $("quickAdd");
    addIngredients(input.value).forEach((p) => {
      if (!ui.draft.items.includes(p.id)) ui.draft.items.push(p.id);
    });
    input.value = "";
    save();
    drawDraftChips();
    input.focus();
  }

  function saveMeal() {
    const d = ui.draft;
    const title = $("mealTitle").value.trim() || "Untitled meal";
    let meal = d.id ? getMeal(d.id) : null;
    if (meal) {
      meal.title = title;
      meal.items = d.items;
    } else {
      meal = { id: uid(), title: title, items: d.items, img: "" };
      state.meals.push(meal);
    }
    if (d.assign) assign(meal.id);
    save();
    closeModal();
    render();
    toast("Meal saved");
  }

  /* ---------- Pantry ---------- */
  function pantryView() {
    const cards = state.ingredients.map((p) => `
      <div class="mcard">
        ${pic(p.img, esc(p.name.charAt(0).toUpperCase()))}
        <div class="mbody">
          <div class="mtitle">${esc(p.name)}</div>
          <div class="acts">
            <button class="btn small" onclick="openPicker('ing', '${p.id}')">Picture</button>
            <button class="btn btn-danger small" onclick="removeIngredient('${p.id}')"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>
      </div>`).join("");

    return `
      <h2 style="margin-bottom:6px">Pantry</h2>
      <p class="note" style="margin-bottom:1rem">Type one or several ingredients separated by commas, then press Enter. Pictures are only added when you choose them.</p>
      <div class="controls">
        <input class="field" id="newItems" placeholder="e.g. avocado, eggs, garri" onkeydown="if (event.key === 'Enter') addFromPantry()">
        <button class="btn btn-primary" onclick="addFromPantry()">Add</button>
      </div>
      <div class="grid tight">${cards || '<p class="note">No ingredients yet.</p>'}</div>
      <h2 style="margin:2rem 0 6px">Wider picture search (optional)</h2>
      <p class="note" style="margin-bottom:10px">Paste a free Pexels API key to also search Pexels photos. TheMealDB and Wikipedia work without it.</p>
      <input class="field" id="pexKey" placeholder="Pexels API key" value="${esc(state.pexelsKey)}" onchange="state.pexelsKey = this.value.trim(); save()">`;
  }

  /* Adds comma-separated names, skipping duplicates. Returns the matching ingredients. */
  function addIngredients(text) {
    return text.split(",").map((s) => s.trim()).filter(Boolean).map((name) => {
      let p = state.ingredients.find((x) => x.name.toLowerCase() === name.toLowerCase());
      if (!p) {
        p = { id: uid(), name: name, img: "" };
        state.ingredients.push(p);
      }
      return p;
    });
  }

  function addFromPantry() {
    const input = $("newItems");
    const added = addIngredients(input.value);
    if (!added.length) return;
    save();
    render();
    $("newItems").focus();
    toast(added.length + " ingredient" + (added.length > 1 ? "s" : "") + " added");
  }

  function removeIngredient(id) {
    const p = getIng(id);
    if (!confirm("Delete " + p.name + "? It will also be removed from your meals.")) return;
    state.ingredients = state.ingredients.filter((x) => x.id !== id);
    state.meals.forEach((m) => { m.items = m.items.filter((i) => i !== id); });
    save();
    render();
  }

  /* ---------- Picture picker ---------- */
  function targetOf(kind, id) {
    return kind === "meal" ? getMeal(id) : getIng(id);
  }

  function openPicker(kind, id) {
    const t = targetOf(kind, id);
    const label = esc(t.name || t.title);
    const args = "'" + kind + "', '" + id + "'";
    openModal(`
      <h3>Picture for ${label}</h3>
      <div class="controls" style="margin-bottom:6px">
        <input class="field" id="pickQuery" value="${label}" onkeydown="if (event.key === 'Enter') runSearch()">
        <button class="btn btn-primary small" onclick="runSearch()">Search</button>
      </div>
      <p class="note">Check each caption before choosing. If nothing matches, upload your own or skip.</p>
      <div class="results" id="results"></div>
      <p class="note" id="status"></p>
      <hr style="border:0;border-top:1px solid var(--border);margin:14px 0">
      <p class="note">Upload your own photo</p>
      <input class="field" type="file" accept="image/*" style="margin-bottom:10px" onchange="uploadPic(${args}, this)">
      <p class="note">Or paste an image link</p>
      <div class="controls">
        <input class="field" id="pickUrl" placeholder="https://...">
        <button class="btn small" onclick="chooseImage(${args}, $('pickUrl').value.trim())">Use link</button>
      </div>
      <div class="acts">
        <button class="btn btn-danger small" onclick="setImg(${args}, '')">No picture</button>
        <button class="btn small" onclick="closeModal()">Close</button>
      </div>`);
    ui.pick = { kind: kind, id: id };
    runSearch();
  }

  function showResults(list) {
    const start = ui.candidates.length;
    ui.candidates.push(...list);
    $("results").insertAdjacentHTML("beforeend", list.map((c, i) => `
      <button class="res" onclick="chooseImage(ui.pick.kind, ui.pick.id, ui.candidates[${start + i}].url)">
        <img src="${esc(c.url)}" alt="">
        <span>${esc(c.label)}</span>
      </button>`).join(""));
  }

  function imageLoads(url) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = url;
    });
  }

  async function runSearch() {
    const q = $("pickQuery").value.trim();
    if (!q) return;
    ui.candidates = [];
    $("results").innerHTML = "";
    $("status").textContent = "Searching...";

    const jobs = [searchMealDb(q), searchWikipedia(q)];
    if (state.pexelsKey) jobs.push(searchPexels(q));
    const done = await Promise.allSettled(jobs);
    done.forEach((r) => {
      if (r.status === "fulfilled" && r.value.length) showResults(r.value);
    });
    $("status").textContent = ui.candidates.length ? "" : "No results found. Try another word, or upload a photo.";
  }

  async function searchMealDb(q) {
    const url = "https://www.themealdb.com/images/ingredients/" + encodeURIComponent(cap(q)) + ".png";
    return (await imageLoads(url)) ? [{ url: url, label: "TheMealDB: exact match" }] : [];
  }

  async function searchWikipedia(q) {
    const api = "https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=6" +
      "&prop=pageimages&piprop=thumbnail&pithumbsize=400&format=json&origin=*&gsrsearch=" + encodeURIComponent(q);
    const data = await (await fetch(api)).json();
    const pages = Object.values((data.query && data.query.pages) || {});
    return pages
      .filter((pg) => pg.thumbnail)
      .map((pg) => ({ url: pg.thumbnail.source, label: "Wikipedia: " + pg.title }));
  }

  async function searchPexels(q) {
    const api = "https://api.pexels.com/v1/search?per_page=8&query=" + encodeURIComponent(q);
    const data = await (await fetch(api, { headers: { Authorization: state.pexelsKey } })).json();
    return (data.photos || []).map((ph) => ({ url: ph.src.medium, label: "Pexels: " + (ph.alt || q) }));
  }

  function resizeBlob(blob) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const objUrl = URL.createObjectURL(blob);
      img.onload = () => {
        const scale = Math.min(1, 400 / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(objUrl);
        resolve(canvas.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = reject;
      img.src = objUrl;
    });
  }

  async function chooseImage(kind, id, url) {
    if (!url) return;
    let data = url;
    try {
      const blob = await (await fetch(url)).blob();
      data = await resizeBlob(blob);
    } catch (e) {
      /* keep the remote link if it cannot be copied into the browser */
    }
    setImg(kind, id, data);
  }

  async function uploadPic(kind, id, input) {
    if (!input.files[0]) return;
    setImg(kind, id, await resizeBlob(input.files[0]));
  }

  function setImg(kind, id, data) {
    targetOf(kind, id).img = data;
    save();
    closeModal();
    render();
    toast(data ? "Picture saved" : "Picture removed");
  }

  /* ---------- Output ---------- */
  function outputView() {
    const cards = [];
    for (let date = ui.outFrom; date && date <= ui.outTo; date = addDays(date, 1)) {
      state.slots.forEach((s) => {
        const m = getMeal((state.plan[date] || {})[s]);
        if (!m) return;
        cards.push(`
          <div class="mcard">
            <div class="mhead">${pretty(date)} · ${esc(s)}</div>
            ${pic(mealImg(m), '<i class="fa-solid fa-bowl-food"></i>')}
            <div class="mbody"><div class="mtitle">${esc(m.title)}</div>${mealChips(m)}</div>
          </div>`);
      });
    }

    return `
      <div class="controls noprint">
        <strong>Range:</strong>
        <input class="field" type="date" style="flex:0 0 auto" value="${ui.outFrom}" onchange="ui.outFrom = this.value; render()">
        <span>to</span>
        <input class="field" type="date" style="flex:0 0 auto" value="${ui.outTo}" onchange="ui.outTo = this.value; render()">
        <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Print or save PDF</button>
        <button class="btn" onclick="downloadPng()"><i class="fa-solid fa-image"></i> Download image</button>
      </div>
      <div class="grid" id="outGrid">
        ${cards.join("") || '<p class="note">No meals planned between these dates.</p>'}
      </div>`;
  }

  function downloadPng() {
    if (typeof html2canvas === "undefined") {
      alert("Image download needs an internet connection. You can still use Print or save PDF.");
      return;
    }
    html2canvas($("outGrid"), { scale: 2, backgroundColor: "#f8fafc", useCORS: true }).then((canvas) => {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "meal-plan.png";
      a.click();
    });
  }

  /* ---------- Save, import, reset ---------- */
  function savePlan() {
    const data = { ingredients: state.ingredients, meals: state.meals, slots: state.slots, plan: state.plan };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "mealcraft-plan-" + iso(new Date()) + ".json";
    a.click();
    toast("Plan saved");
  }

  function importPlan(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        const ok = Array.isArray(d.ingredients) && Array.isArray(d.meals) && Array.isArray(d.slots) && typeof d.plan === "object";
        if (!ok) throw new Error("bad file");
        if (!confirm("Importing replaces your current pantry, meals and plan. Continue?")) return;
        state.ingredients = d.ingredients;
        state.meals = d.meals;
        state.slots = d.slots;
        state.plan = d.plan;
        save();
        render();
        toast("Plan imported");
      } catch (e) {
        alert("That file is not a valid saved plan.");
      }
    };
    reader.readAsText(file);
    input.value = "";
  }

  function resetAll() {
    if (!confirm("Clear your pantry, meals and every planned day? This cannot be undone.")) return;
    const key = state.pexelsKey;
    state = emptyState();
    state.pexelsKey = key;
    save();
    render();
    toast("Everything cleared");
  }

  render();
</script>
</body>
</html>
